
plugins {
    id 'org.springframework.boot' version '3.5.14'
    id 'application'
    id 'com.github.ben-manes.versions' version '0.54.0'
    id 'se.patrikerdes.use-latest-versions' version '0.2.19'
}

def isNonStable = { String version ->
    def unstableKeyword = ['alpha', 'beta', 'rc', 'cr', 'm', 'preview', 'b', 'ea'].any {
        version.toLowerCase().contains(it)
    }
    return unstableKeyword
}

def isSpringBoot4 = { ModuleComponentIdentifier id ->
    id.group == 'org.springframework.boot' && id.version.startsWith('4.')
}

def isSpringDoc3 = { ModuleComponentIdentifier id ->
    id.group == 'org.springdoc' && id.version.startsWith('3.')
}

dependencyUpdates {
    rejectVersionIf { selection ->
        isNonStable(selection.candidate.version) ||
        isSpringBoot4(selection.candidate) ||
        isSpringDoc3(selection.candidate)
    }
}

repositories {
    mavenCentral()
    maven { url = "https://clojars.org/repo" }
}

apply plugin: 'java'
apply plugin: 'io.spring.dependency-management'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

group = 'uk.gov.fco.documentupload'
version = '1.0.0'

application {
    mainClass = 'uk.gov.fco.documentupload.Application'
}

bootJar {
    archiveFileName = 'document-upload.jar'
    manifest {
        attributes "Implementation-Version": version
    }
}

dependencies {
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    compileOnly 'org.projectlombok:lombok:1.18.46'

    implementation 'software.amazon.awssdk:s3:2.46.2'
    implementation 'software.amazon.awssdk:rekognition:2.46.2'
    implementation 'software.amazon.awssdk:sts:2.46.2'
    implementation 'fi.solita.clamav:clamav-client:1.0.1'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jersey'
    implementation 'org.springframework.boot:spring-boot-configuration-processor'
    implementation 'org.apache.pdfbox:pdfbox:3.0.7'
    implementation 'org.apache.pdfbox:pdfbox-tools:3.0.7'
    implementation 'org.apache.tika:tika-core:3.3.1'
    implementation 'commons-io:commons-io:2.22.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.mockito:mockito-core:5.23.0'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

test {
    useJUnitPlatform()
}

compileJava.dependsOn(processResources)
