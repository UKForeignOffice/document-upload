spring:
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_absent
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 70MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: false

server:
  port: 9000
  servlet:
    context-path: ${CONTEXT_PATH:/v1}
  compression:
    enabled: true

logging:
  pattern:
    console: "%logger{15} %msg%n"

app:
  mime-types: "application/pdf,image/png,image/jpeg,image/jpg,image/gif,application/vnd.oasis.opendocument.text"

antivirus:
  enabled: ${ANTIVIRUS_ENABLED:false}
  host: ${ANTIVIRUS_HOST:localhost}
  port: ${ANTIVIRUS_PORT:3310}
  timeout: ${ANTIVIRUS_TIMEOUT:30000}

storage:
  engine: ${STORAGE_ENGINE:file}
  file:
    location: /tmp
  s3:
    bucket: ${S3_BUCKET}

ocr:
  enabled: ${ENABLE_QUALITY_CHECK:false}
  sharpness:
    threshold: ${SHARPNESS_THRESHOLD:60}

---

spring:
  config:
    activate:
      on-profile: production
